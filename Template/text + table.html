<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valguy // TEXT + TABLE</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div class="layout-container">
       <main class="main-content">
 


<!-- TEXT + TABLE -->
        <section>
            <div class="tweet-card">
                <div class="tweet-header">
                    <img src="resources\images\logo.jpg" class="tweet-avatar" alt="Avatar">
                    <div class="tweet-meta">
                        <span class="tweet-author">Valguy</span>
                        <span class="tweet-handle">@valguypmt • Data Table Template</span>
                    </div>
                </div>
                <div class="tweet-body">
                    This standalone template displays structured data, specifications, or logs in a responsive table.
                </div>
                <div class="tweet-table-container">
                    <table class="tweet-table">
                        <thead>
                            <tr>
                                <th>Item / Component</th>
                                <th>Specification</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>CPU</td>
                                <td>AMD Ryzen 5 2600</td>
                                <td>Active</td>
                            </tr>
                            <tr>
                                <td>GPU</td>
                                <td>AMD Radeon RX 6700 XT</td>
                                <td>Active</td>
                            </tr>
                            <tr>
                                <td>RAM</td>
                                <td>24GB DDR4</td>
                                <td>Active</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="tweet-timestamp">08:00 PM • Sep 2026</div>
            </div>
        </section>

       


    </main>
</div>
    
</footer>

</body>
</html>
