<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valguy // TEXT + TABLE + BUTTON</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div class="layout-container">
    <main class="main-content">

        <!-- TEXT + TABLE + BUTTON -->
        <section>
            <div class="tweet-card tweet-with-button">
                <div class="tweet-header">
                    <img src="resources\images\logo.jpg" class="tweet-avatar" alt="Avatar">
                    <div class="tweet-meta">
                        <span class="tweet-author">Valguy</span>
                        <span class="tweet-handle">@valguypmt • Table + Button Template</span>
                    </div>
                </div>
                <div class="tweet-body">
                    This standalone template displays structured data alongside a direct call-to-action button.
                </div>
                <div class="tweet-table-container">
                    <table class="tweet-table">
                        <thead>
                            <tr>
                                <th>Service / Server</th>
                                <th>Port / Node</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>SullivanServer Auth</td>
                                <td>Port 3000</td>
                                <td>Online</td>
                            </tr>
                            <tr>
                                <td>Arch Linux CLI Node</td>
                                <td>SSH / tmux</td>
                                <td>Active</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <a href="https://github.com/valguypmt/SullivanServer" target="_blank" class="tweet-action-btn">View Repository &rarr;</a>
                <div class="tweet-timestamp">11:10 AM • Sep 2026</div>
            </div>
        </section>

    </main>
</div>
</body>
</html>
